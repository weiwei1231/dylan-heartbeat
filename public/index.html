<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>kei</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#e0e0e0}

/* login */
#login{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:16px}
#login h1{font-size:20px;font-weight:400;color:#888}
#login input{width:260px;padding:12px 16px;border:1px solid #333;border-radius:8px;background:#1a1a1a;color:#e0e0e0;font-size:14px;outline:none}
#login input:focus{border-color:#555}
#login button{width:260px;padding:12px;border:none;border-radius:8px;background:#2a2a2a;color:#e0e0e0;font-size:14px;cursor:pointer}
#login button:hover{background:#333}
#login .err{color:#e55;font-size:12px;height:16px}

/* chat */
#app{display:none;flex-direction:column;height:100%;max-width:680px;margin:0 auto}
#header{padding:12px 16px;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;justify-content:space-between}
#header h1{font-size:16px;font-weight:500;color:#aaa}
#header button{background:none;border:1px solid #333;border-radius:6px;color:#888;padding:4px 10px;font-size:12px;cursor:pointer}
#header button:hover{color:#e0e0e0;border-color:#555}

#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.6;word-wrap:break-word;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:#1a3a5c;color:#d0e8ff;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:#1e1e1e;color:#d0d0d0;border-bottom-left-radius:4px}
.msg.assistant.streaming{opacity:0.9}
.msg.error{align-self:center;background:#3a1a1a;color:#e88;font-size:12px;text-align:center}

#input-area{padding:12px 16px;border-top:1px solid #1a1a1a;display:flex;gap:8px;align-items:flex-end}
#input-area textarea{flex:1;padding:10px 14px;border:1px solid #333;border-radius:12px;background:#1a1a1a;color:#e0e0e0;font-size:14px;line-height:1.5;resize:none;outline:none;max-height:120px;min-height:42px;font-family:inherit}
#input-area textarea:focus{border-color:#555}
#input-area button{width:42px;height:42px;border:none;border-radius:50%;background:#2a4a6a;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#input-area button:hover{background:#3a5a7a}
#input-area button:disabled{opacity:0.3;cursor:not-allowed}

.typing{display:inline-block;width:6px;height:6px;background:#888;border-radius:50%;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
</style>
</head>
<body>

<div id="login">
  <h1>kei-chat</h1>
  <input id="key-input" type="password" placeholder="gateway key" autocomplete="off">
  <button onclick="tryLogin()">进入</button>
  <div class="err" id="login-err"></div>
</div>

<div id="app">
  <div id="header">
    <h1>kei</h1>
    <button onclick="clearChat()">新对话</button>
  </div>
  <div id="messages"></div>
  <div id="input-area">
    <textarea id="user-input" rows="1" placeholder="说点什么..." onkeydown="handleKey(event)"></textarea>
    <button id="send-btn" onclick="sendMessage()">↑</button>
  </div>
</div>

<script>
const API_URL = '/v1/chat/completions';
let apiKey = localStorage.getItem('kc_key') || '';
let messages = [];
let isStreaming = false;

if (apiKey) showChat();

function tryLogin() {
  const key = document.getElementById('key-input').value.trim();
  if (!key) { document.getElementById('login-err').textContent = '请输入 key'; return; }
  apiKey = key;
  localStorage.setItem('kc_key', key);
  showChat();
}

function showChat() {
  document.getElementById('login').style.display = 'none';
  const app = document.getElementById('app');
  app.style.display = 'flex';
  document.getElementById('user-input').focus();
  loadHistory();
}

function loadHistory() {
  try {
    const saved = localStorage.getItem('kc_history');
    if (saved) {
      messages = JSON.parse(saved);
      const container = document.getElementById('messages');
      container.innerHTML = '';
      for (const msg of messages) {
        appendBubble(msg.role, msg.content);
      }
      scrollBottom();
    }
  } catch(e) { messages = []; }
}

function saveHistory() {
  try {
    const toSave = messages.slice(-60);
    localStorage.setItem('kc_history', JSON.stringify(toSave));
  } catch(e) {}
}

function clearChat() {
  messages = [];
  localStorage.removeItem('kc_history');
  document.getElementById('messages').innerHTML = '';
}

function appendBubble(role, text, cls) {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role + (cls ? ' ' + cls : '');
  div.textContent = text || '';
  container.appendChild(div);
  return div;
}

function scrollBottom() {
  const c = document.getElementById('messages');
  c.scrollTop = c.scrollHeight;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

document.getElementById('user-input').addEventListener('input', function() { autoResize(this); });

async function sendMessage() {
  if (isStreaming) return;
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  autoResize(input);

  messages.push({ role: 'user', content: text });
  appendBubble('user', text);
  scrollBottom();

  const sendBtn = document.getElementById('send-btn');
  sendBtn.disabled = true;
  isStreaming = true;

  const assistantDiv = appendBubble('assistant', '', 'streaming');
  let fullText = '';

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey
      },
      body: JSON.stringify({
        model: 'kei',
        messages: messages.map(m => ({ role: m.role, content: m.content })),
        stream: true
      })
    });

    if (!res.ok) {
      if (res.status === 401) {
        localStorage.removeItem('kc_key');
        appendBubble('error', 'key 无效，请刷新重新输入', 'error');
        throw new Error('auth');
      }
      const errText = await res.text();
      throw new Error(errText || 'HTTP ' + res.status);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ') || line === 'data: [DONE]') continue;
        try {
          const parsed = JSON.parse(line.slice(6));
          const delta = parsed.choices?.[0]?.delta?.content || '';
          fullText += delta;
          assistantDiv.textContent = fullText;
          scrollBottom();
        } catch(e) {}
      }
    }

    assistantDiv.classList.remove('streaming');
    if (fullText.trim()) {
      messages.push({ role: 'assistant', content: fullText });
    }
    saveHistory();

  } catch(err) {
    if (err.message !== 'auth') {
      assistantDiv.classList.remove('streaming');
      assistantDiv.classList.add('error');
      assistantDiv.textContent = '出错了: ' + (err.message || '未知错误');
    }
  } finally {
    isStreaming = false;
    sendBtn.disabled = false;
    input.focus();
  }
}
</script>
</body>
</html>
