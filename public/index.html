<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>kei</title>
<style>
:root {
  --bg: #0d0d0d;
  --surface: #161616;
  --surface-2: #1e1e1e;
  --border: #2a2a2a;
  --text: #e0e0e0;
  --text-dim: #888;
  --user-bubble: #1a3a5c;
  --accent: #4a90d9;
  --accent-hover: #5ba0e9;
  --danger: #c0392b;
  --radius: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  overflow: hidden;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 720px;
  margin: 0 auto;
}

/* Header */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  flex-shrink: 0;
}

header h1 {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

header .actions {
  display: flex;
  gap: 8px;
}

header .actions button {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 4px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s;
}

header .actions button:hover {
  border-color: var(--accent);
  color: var(--text);
}

/* Messages */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  scroll-behavior: smooth;
}

#messages::-webkit-scrollbar { width: 4px; }
#messages::-webkit-scrollbar-track { background: transparent; }
#messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.message {
  margin-bottom: 16px;
  display: flex;
  flex-direction: column;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.message.user {
  align-items: flex-end;
}

.message.assistant {
  align-items: flex-start;
}

.message .role {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 4px;
  padding: 0 4px;
}

.message .bubble {
  max-width: 85%;
  padding: 10px 14px;
  border-radius: var(--radius);
  word-break: break-word;
  white-space: pre-wrap;
}

.message.user .bubble {
  background: var(--user-bubble);
  border-bottom-right-radius: 4px;
}

.message.assistant .bubble {
  background: var(--surface-2);
  border-bottom-left-radius: 4px;
}

.message .bubble code {
  background: rgba(255,255,255,0.08);
  padding: 1px 5px;
  border-radius: 3px;
  font-family: "SF Mono", Monaco, monospace;
  font-size: 13px;
}

.message .bubble pre {
  background: rgba(0,0,0,0.3);
  padding: 10px 12px;
  border-radius: 6px;
  overflow-x: auto;
  margin: 8px 0;
  font-size: 13px;
}

.message .bubble pre code {
  background: none;
  padding: 0;
}

.typing-indicator {
  display: inline-flex;
  gap: 4px;
  padding: 4px 0;
}

.typing-indicator span {
  width: 6px;
  height: 6px;
  background: var(--text-dim);
  border-radius: 50%;
  animation: typingBounce 1.2s infinite;
}

.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-4px); opacity: 1; }
}

/* Empty state */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-dim);
  gap: 8px;
}

.empty-state .logo {
  font-size: 32px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 8px;
}

/* Input */
#input-area {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  background: var(--bg);
  flex-shrink: 0;
}

#input {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 15px;
  font-family: inherit;
  line-height: 1.5;
  resize: none;
  max-height: 120px;
  outline: none;
  transition: border-color 0.2s;
}

#input:focus {
  border-color: var(--accent);
}

#input::placeholder {
  color: var(--text-dim);
}

#send-btn {
  background: var(--accent);
  border: none;
  color: white;
  padding: 10px 20px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 15px;
  font-weight: 500;
  transition: background 0.2s;
  flex-shrink: 0;
  align-self: flex-end;
}

#send-btn:hover {
  background: var(--accent-hover);
}

#send-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* Modal */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  align-items: center;
  justify-content: center;
}

.modal.show {
  display: flex;
}

.modal-content {
  background: var(--surface);
  padding: 24px;
  border-radius: 16px;
  width: 90%;
  max-width: 360px;
  border: 1px solid var(--border);
}

.modal-content h3 {
  margin-bottom: 16px;
  font-size: 16px;
}

.modal-content label {
  display: block;
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 6px;
}

.modal-content input {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  margin-bottom: 16px;
}

.modal-content input:focus {
  border-color: var(--accent);
}

.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

.modal-actions button {
  padding: 8px 20px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 14px;
}

.btn-primary {
  background: var(--accent);
  color: white;
}

.btn-secondary {
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border) !important;
}

/* Time labels */
.time-label {
  text-align: center;
  color: var(--text-dim);
  font-size: 12px;
  margin: 16px 0 8px;
}

/* Mobile tweaks */
@media (max-width: 480px) {
  #input-area { padding: 8px 12px; }
  #messages { padding: 12px; }
  .message .bubble { max-width: 90%; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>kei</h1>
    <div class="actions">
      <button onclick="clearChat()">清空</button>
      <button onclick="showSettings()">设置</button>
    </div>
  </header>
  <div id="messages"></div>
  <div id="input-area">
    <textarea id="input" rows="1" placeholder="说点什么..."></textarea>
    <button id="send-btn" onclick="sendMessage()">发送</button>
  </div>
</div>

<div id="settings-modal" class="modal">
  <div class="modal-content">
    <h3>设置</h3>
    <label>API Key</label>
    <input type="password" id="key-input" placeholder="输入 Gateway API Key">
    <label>模型</label>
    <input type="text" id="model-input" placeholder="留空使用默认">
    <div class="modal-actions">
      <button class="btn-secondary" onclick="hideSettings()">取消</button>
      <button class="btn-primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'kc-chat';
const API_PATH = '/v1/chat/completions';

let state = {
  messages: [],
  apiKey: '',
  model: '',
  isGenerating: false
};

// ========== Init ==========

function init() {
  loadState();
  if (!state.apiKey) {
    showSettings();
  }
  renderMessages();
  autoResizeInput();
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      state.messages = parsed.messages || [];
      state.apiKey = parsed.apiKey || '';
      state.model = parsed.model || '';
    }
  } catch (e) {
    console.error('Failed to load state:', e);
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      messages: state.messages.slice(-100),
      apiKey: state.apiKey,
      model: state.model
    }));
  } catch (e) {
    console.error('Failed to save state:', e);
  }
}

// ========== Messages ==========

function renderMessages() {
  const container = document.getElementById('messages');
  if (state.messages.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="logo">kei</div>
        <div>说点什么吧</div>
      </div>`;
    return;
  }

  container.innerHTML = state.messages.map((msg, i) => {
    const roleLabel = msg.role === 'user' ? '微微' : '小克';
    return `
      <div class="message ${msg.role}">
        <div class="role">${roleLabel}</div>
        <div class="bubble">${renderContent(msg.content)}</div>
      </div>`;
  }).join('');

  scrollToBottom();
}

function renderContent(text) {
  if (!text) return '';
  let html = escapeHtml(text);
  // Code blocks
  html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return html;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function addMessageToUI(role, content) {
  const container = document.getElementById('messages');
  // Remove empty state if present
  const empty = container.querySelector('.empty-state');
  if (empty) empty.remove();

  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.innerHTML = `
    <div class="role">${role === 'user' ? '微微' : '小克'}</div>
    <div class="bubble">${role === 'user' ? renderContent(content) : ''}</div>`;
  container.appendChild(div);
  scrollToBottom();
  return div.querySelector('.bubble');
}

function scrollToBottom() {
  const container = document.getElementById('messages');
  requestAnimationFrame(() => {
    container.scrollTop = container.scrollHeight;
  });
}

// ========== Send Message ==========

async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || state.isGenerating) return;

  if (!state.apiKey) {
    showSettings();
    return;
  }

  // Add user message
  state.messages.push({ role: 'user', content: text });
  addMessageToUI('user', text);
  input.value = '';
  resetInputHeight();
  saveState();

  // Start generating
  state.isGenerating = true;
  document.getElementById('send-btn').disabled = true;

  const bubble = addMessageToUI('assistant', '');
  bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

  try {
    const apiMessages = state.messages.map(m => ({ role: m.role, content: m.content }));

    const response = await fetch(API_PATH, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Gateway-API-Key': state.apiKey
      },
      body: JSON.stringify({
        model: state.model || undefined,
        messages: apiMessages,
        stream: true
      })
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`HTTP ${response.status}: ${errText.slice(0, 200)}`);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullContent = '';
    let buffer = '';

    bubble.innerHTML = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
          try {
            const data = JSON.parse(line.slice(6));
            const delta = data.choices?.[0]?.delta?.content || '';
            if (delta) {
              fullContent += delta;
              bubble.innerHTML = renderContent(fullContent);
              scrollToBottom();
            }
          } catch (e) {
            // skip non-JSON lines
          }
        }
      }
    }

    if (fullContent) {
      state.messages.push({ role: 'assistant', content: fullContent });
      saveState();
    }

  } catch (err) {
    console.error('Request failed:', err);
    bubble.innerHTML = `<span style="color: var(--danger)">出错了：${escapeHtml(err.message)}</span>`;
  } finally {
    state.isGenerating = false;
    document.getElementById('send-btn').disabled = false;
  }
}

// ========== Input ==========

function autoResizeInput() {
  const input = document.getElementById('input');
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
}

function resetInputHeight() {
  const input = document.getElementById('input');
  input.style.height = 'auto';
}

// ========== Settings ==========

function showSettings() {
  document.getElementById('key-input').value = state.apiKey;
  document.getElementById('model-input').value = state.model;
  document.getElementById('settings-modal').classList.add('show');
}

function hideSettings() {
  document.getElementById('settings-modal').classList.remove('show');
}

function saveSettings() {
  state.apiKey = document.getElementById('key-input').value.trim();
  state.model = document.getElementById('model-input').value.trim();
  saveState();
  hideSettings();
}

// ========== Clear ==========

function clearChat() {
  if (!confirm('清空所有聊天记录？')) return;
  state.messages = [];
  saveState();
  renderMessages();
}

// ========== Go ==========
init();
</script>
</body>
</html>
